services:
  - type: web
    name: ipo-platform
    env: python
    buildCommand: pip install -r requirements.txt && python ipo_platform/manage.py collectstatic --noinput
    startCommand: python ipo_platform/manage.py migrate --noinput && gunicorn ipo_platform.wsgi:application --chdir ipo_platform
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: ipo_platform.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ipo-platform-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
databases:
  - name: ipo-platform-db
