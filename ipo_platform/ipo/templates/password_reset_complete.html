{% extends "base.html" %}
{% block title %}Reset Complete - IPO Platform{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center"
    style="background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0" style="border-radius: 12px; overflow: hidden;">
                    <div class="card-body p-0">
                        <div
                            style="background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%); color: white; padding: 2rem; text-align: center;">
                            <i class="fas fa-check-double"
                                style="font-size: 2.5rem; margin-bottom: 1rem; display: block;"></i>
                            <h4 class="mb-1" style="font-weight: 700;">Password Reset!</h4>
                        </div>
                        <div style="padding: 2rem; text-align: center;">
                            <p class="mb-4">Your password has been set. You may go ahead and log in now.</p>
                            <a href="{% url 'login' %}" class="btn w-100 py-2 fw-600"
                                style="background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; transition: all 0.3s ease;">
                                <i class="fas fa-sign-in-alt me-2"></i> Log In
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
