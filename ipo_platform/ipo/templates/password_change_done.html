{% extends "base.html" %}
{% block title %}Password Changed - IPO Platform{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 text-center" style="border-radius: 12px; overflow: hidden;">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="mb-3 fw-bold">Password Changed!</h3>
                    <p class="text-muted mb-4">Your password was changed successfully.</p>
                    <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 py-2 fw-600">Return to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
