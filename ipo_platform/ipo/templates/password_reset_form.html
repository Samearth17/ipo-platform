{% extends "base.html" %}
{% block title %}Reset Password - IPO Platform{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0" style="border-radius: 12px; overflow: hidden;">
                    <div class="card-body p-0">
                        <div style="background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%); color: white; padding: 2rem; text-align: center;">
                            <i class="fas fa-key" style="font-size: 2.5rem; margin-bottom: 1rem; display: block;"></i>
                            <h4 class="mb-1" style="font-weight: 700;">Reset Password</h4>
                            <p style="opacity: 0.9; margin: 0;">Enter your email to receive reset instructions</p>
                        </div>
                        <div style="padding: 2rem;">
                            <form method="post">
                                {% csrf_token %}
                                {% if form.errors %}
                                <div class="alert alert-danger">
                                    {{ form.errors }}
                                </div>
                                {% endif %}
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-600" style="font-weight: 600;">Email Address</label>
                                    <div class="input-group" style="border-radius: 8px; overflow: hidden;">
                                        <span class="input-group-text" style="background: #f5f7fa; border: 1px solid #e0e0e0;">
                                            <i class="fas fa-envelope" style="color: #0d47a1;"></i>
                                        </span>
                                        <input
                                            type="email"
                                            class="form-control"
                                            id="id_email"
                                            name="email"
                                            placeholder="Enter your registered email"
                                            required
                                            style="border: 1px solid #e0e0e0; padding: 0.75rem;"
                                        >
                                    </div>
                                </div>
                                <button type="submit" class="btn w-100 py-2 fw-600" style="background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; transition: all 0.3s ease;">
                                    <i class="fas fa-paper-plane me-2"></i> Send Reset Link
                                </button>
                                <div class="text-center mt-3">
                                    <a href="{% url 'login' %}" style="text-decoration: none; color: #0d47a1; font-weight: 600;">Back to Login</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
